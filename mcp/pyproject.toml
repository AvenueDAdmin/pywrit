[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "writ-mcp"
version = "0.1.1"
description = "Writ MCP server — commit-time policy checks for AI agents (ALLOW/DENY/STEP_UP + audit receipts)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = [
    "mcp>=1.0,<2",
    "httpx>=0.27",
]
keywords = ["ai-agents", "mcp", "policy", "audit-log", "guardrails"]

[project.urls]
Homepage = "https://github.com/AvenueDAdmin/pywrit"
Repository = "https://github.com/AvenueDAdmin/pywrit/tree/main/mcp"
Documentation = "https://withwrit.com/docs"

[project.scripts]
writ-mcp = "writ_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
