name: Release pywrit, writ-mcp, writ-scan, and Action tags

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  issues: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install npm CLI with trusted publishing support
        run: npm install -g npm@"^11.5.1"

      - name: Debug OIDC and npm auth state
        run: |
          echo "=== OIDC request URL ==="
          echo "${ACTIONS_ID_TOKEN_REQUEST_URL}"
          echo "=== Mint OIDC token ==="
          curl -s -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}" | jq . | sed 's/"value": "[^"]*"/"value": "REDACTED"/g' || echo "OIDC mint failed"
          echo "=== active .npmrc ==="
          cat "${NPM_CONFIG_USERCONFIG}" 2>/dev/null | sed 's/_authToken=.*/_authToken=REDACTED/g' || echo "no npmrc"
          echo "=== npm auth config ==="
          npm config list 2>/dev/null | grep -i auth | sed 's/_authToken=.*/_authToken=REDACTED/g' || true
          echo "=== auth token env vars ==="
          env | grep -i auth_token | sed 's/=.*$/=REDACTED/g' || true

      - name: Install Python build tools
        run: python -m pip install build twine

      - name: Build and publish pywrit
        run: |
          python -m build
          twine upload --skip-existing dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}

      - name: Build and publish writ-mcp
        if: hashFiles('mcp/pyproject.toml') != ''
        working-directory: mcp
        run: |
          python -m build
          twine upload --skip-existing dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}

      - name: Build and publish writ-scan npm package
        if: hashFiles('npm/package.json') != ''
        working-directory: npm
        # Trusted publishing (OIDC) — npm CLI 11.5.1+ / Node 22.14+.
        # NODE_AUTH_TOKEN is unset and any setup-node _authToken line is removed
        # so npm uses OIDC instead of legacy token auth.
        run: |
          unset NODE_AUTH_TOKEN
          npm config delete //registry.npmjs.org/:_authToken || true
          npm publish --access public

      - name: Move GitHub Action major/minor tags
        if: hashFiles('action.yml') != ''
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          MAJOR="v${VERSION%%.*}"
          MINOR="v$(echo "$VERSION" | cut -d. -f1-2)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin --tags --force
          for TAG in "$MAJOR" "$MINOR"; do
            git tag -fa "$TAG" "$GITHUB_REF_NAME" -m "Release $TAG pointing to $GITHUB_REF_NAME"
            git push -f origin "$TAG"
          done

      - name: Open release checklist issue
        if: hashFiles('.github/RELEASE_CHECKLIST.md') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${GITHUB_REF_NAME}
          sed "s/__VERSION__/${VERSION}/g" .github/RELEASE_CHECKLIST.md > /tmp/checklist.md
          gh issue create --title "Release checklist: ${VERSION}" --body-file /tmp/checklist.md --label release || true
