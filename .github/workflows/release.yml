name: Release pywrit, writ-mcp, writ-scan, and Action tags

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  issues: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install npm CLI with trusted publishing support
        run: npm install -g npm@"^11.5.1"

      - name: Install Python build tools
        run: python -m pip install build twine

      - name: Build and publish pywrit
        run: |
          python -m build
          twine upload --skip-existing dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}

      - name: Build and publish writ-mcp
        if: hashFiles('mcp/pyproject.toml') != ''
        working-directory: mcp
        run: |
          python -m build
          twine upload --skip-existing dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}

      - name: Build and publish writ-scan npm package
        if: hashFiles('npm/package.json') != ''
        working-directory: npm
        # OIDC trusted publishing is configured but not yet working for this
        # package on npmjs.com; falling back to NPM_TOKEN for v0.2.7 only.
        # id-token: write is kept so OIDC can be re-enabled once registry-side
        # claim matching is fixed.
        run: |
          printf 'registry=https://registry.npmjs.org/\n//registry.npmjs.org/:_authToken=%s\n' "${NPM_TOKEN}" > .npmrc
          npm publish --access public
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Move GitHub Action major/minor tags
        if: hashFiles('action.yml') != ''
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          MAJOR="v${VERSION%%.*}"
          MINOR="v$(echo "$VERSION" | cut -d. -f1-2)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin --tags --force
          for TAG in "$MAJOR" "$MINOR"; do
            git tag -fa "$TAG" "$GITHUB_REF_NAME" -m "Release $TAG pointing to $GITHUB_REF_NAME"
            git push -f origin "$TAG"
          done

      - name: Open release checklist issue
        if: hashFiles('.github/RELEASE_CHECKLIST.md') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${GITHUB_REF_NAME}
          sed "s/__VERSION__/${VERSION}/g" .github/RELEASE_CHECKLIST.md > /tmp/checklist.md
          gh issue create --title "Release checklist: ${VERSION}" --body-file /tmp/checklist.md --label release || true

  smithery:
    name: Publish writ-mcp bundle to Smithery
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Get writ-mcp version
        id: mcp-version
        run: |
          VERSION=$(python3 -c "import re; print(re.search(r'^version\s*=\s*\"([^\"]+)\"', open('mcp/pyproject.toml').read(), re.M).group(1))")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install writ-mcp from source
        run: python -m pip install ./mcp

      - name: Wait for PyPI to serve the new version
        # The Smithery scanner pip-installs writ-mcp==VERSION at deploy time,
        # so the release job's twine upload must be visible first.
        env:
          MCP_VERSION: ${{ steps.mcp-version.outputs.version }}
        run: |
          VERSION=$MCP_VERSION
          for i in $(seq 1 60); do
            SEEN=$(python -c "
          import json, urllib.request
          try:
              data = json.load(urllib.request.urlopen('https://pypi.org/pypi/writ-mcp/json', timeout=15))
              print(' '.join(data['releases'].keys()))
          except Exception:
              print('')
          " 2>/dev/null)
            case " $SEEN " in
              *" $VERSION "*) echo "writ-mcp $VERSION is live on PyPI"; exit 0 ;;
            esac
            echo "waiting for writ-mcp $VERSION on PyPI (attempt $i/60)..."
            sleep 20
          done
          echo "::error::writ-mcp $VERSION never appeared on PyPI"
          exit 1

      - name: Build the .mcpb bundle
        run: python .github/smithery/build_mcpb.py
        env:
          WRIT_MCP_VERSION: ${{ steps.mcp-version.outputs.version }}

      - name: Check Smithery API key
        run: |
          if [ -z "$SMITHERY_API_KEY" ]; then
            echo "::error::SMITHERY_API_KEY repo secret is not set. Add it at withwrit/pywrit → Settings → Secrets and variables → Actions → New repository secret (value: a Smithery API key from smithery.ai/account/api-keys)."
            exit 1
          fi
        env:
          SMITHERY_API_KEY: ${{ secrets.SMITHERY_API_KEY }}

      - name: Publish to Smithery
        run: npx -y @smithery/cli@4.11.1 mcp publish ./writ-mcp.mcpb -n withwrit/writ-mcp
        env:
          SMITHERY_API_KEY: ${{ secrets.SMITHERY_API_KEY }}

  mcp-registry:
    name: Publish server.json to Official MCP Registry
    needs: release
    runs-on: ubuntu-latest
    # This job uses GitHub OIDC (requires id-token: write at workflow level).
    # mcp/pyproject.toml is assumed to exist; the job reads writ-mcp's version from it.
    steps:
      - uses: actions/checkout@v4

      - name: Get writ-mcp version
        id: mcp-version
        run: |
          VERSION=$(python3 -c "import re; print(re.search(r'^version\s*=\s*\"([^\"]+)\"', open('mcp/pyproject.toml').read(), re.M).group(1))")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          sudo mv mcp-publisher /usr/local/bin/
          mcp-publisher --version || true

      - name: Stamp version into server.json
        env:
          MCP_VERSION: ${{ steps.mcp-version.outputs.version }}
        run: |
          python3 - "$MCP_VERSION" <<'PY'
          import json, sys
          from pathlib import Path
          ver = sys.argv[1]
          p = Path("server.json")
          data = json.loads(p.read_text())
          data["version"] = ver
          data["packages"][0]["version"] = ver
          p.write_text(json.dumps(data, indent=2) + "\n")
          PY

      - name: Publish to registry.modelcontextprotocol.io
        run: |
          mcp-publisher login github-oidc
          mcp-publisher publish server.json
